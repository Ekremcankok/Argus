adcs-esc4:
  title: "ADCS ESC4 (şablon üzerinde yazma/ACL)"
  severity: critical
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, acl, privesc]
  summary: "Şablon üzerinde Write/GenericAll → şablonu ESC1'e çevir."
  description: >
    Düşük yetkili principal bir sertifika şablonu üzerinde yazma hakkına sahip;
