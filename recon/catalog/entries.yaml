    (ESC1) domain yetki yükseltir.
  exploitation: "MANUEL — certipy template ile şablonu zafiyetli yap, sonra ESC1 zinciri."
  remediation: "Şablon ACL'lerini sıkılaştırın (yalnız yetkili yöneticiler Write)."
  references:
    - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

adcs-esc5:
  title: "ADCS ESC5 (PKI nesne ACL'i)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, acl]
  summary: "CA sunucu/PKI AD nesneleri üzerinde zayıf ACL → CA ele geçirme."
  description: >
    CA bilgisayar hesabı veya PKI ile ilgili AD nesneleri (Enrollment Services,
    NtAuthCertificates) üzerindeki aşırı haklar CA'yı veya güveni ele geçirmeye yol açar.
  exploitation: "MANUEL — ACL suistimali ile CA/PKI nesnesi ele geçirilir."
  remediation: "PKI AD nesnelerinin sahiplik/ACL'lerini Tier-0'a kısıtlayın."
  references:
    - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

adcs-esc6:
  title: "ADCS ESC6 (EDITF_ATTRIBUTESUBJECTALTNAME2)"
  severity: critical
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "CA bayrağı SAN'ı her talepte serbest bırakır → herhangi biri olarak sertifika."
  description: >
    CA'da EDITF_ATTRIBUTESUBJECTALTNAME2 etkin; herhangi bir şablonla yapılan talepte
    saldırgan SAN'a istediği UPN'i (ör. Administrator) ekleyip o kullanıcı olur.
  exploitation: "MANUEL — certipy req -upn administrator ile; CA bayrağı aktifken."
  remediation: "CA'da EDITF_ATTRIBUTESUBJECTALTNAME2 bayrağını kaldırıp CA'yı yeniden başlatın."
  references:
    - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

adcs-esc7:
  title: "ADCS ESC7 (CA yönetim hakkı — ManageCA/ManageCertificates)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "CA üzerinde yönetim hakkı → SAN'ı aç veya talepleri onayla."
  description: >
    ManageCA/ManageCertificates hakkı olan principal, CA'da ESC6 bayrağını açabilir
    veya bekleyen sertifika taleplerini onaylayarak yetki yükseltir.
  exploitation: "MANUEL — certipy ca ile flag değiştir / talep onayla."
  remediation: "CA yönetim rollerini (ManageCA/ManageCertificates) sıkı kısıtlayın."
  references:
    - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

adcs-esc9:
  title: "ADCS ESC9 (szOID_NTDS_CA_SECURITY_EXT yok)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "Güvenlik uzantısı yok + zayıf eşleme → kimlik taklidi."
  description: >
    Şablonda security extension (SID bağlama) yoksa ve hesap eşlemesi zayıfsa,
    altUPN manipülasyonuyla başka kullanıcı taklit edilebilir.
  exploitation: "MANUEL — certipy ile UPN değiştirip hedef kullanıcı sertifikası alınır."
  remediation: "StrongCertificateBindingEnforcement=2; security extension zorunlu."
  references:
    - "https://github.com/ly4k/Certipy/wiki"

adcs-esc10:
  title: "ADCS ESC10 (zayıf sertifika eşlemeleri)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "CertificateMappingMethods / zayıf binding → kimlik taklidi."
  description: >
    DC'de zayıf sertifika eşleme ayarları (CertificateMappingMethods=0x4 veya
    StrongCertificateBindingEnforcement=0) UPN tabanlı taklide izin verir.
  exploitation: "MANUEL — Shadow Credentials/UPN ile hedef kullanıcı kimliği."
  remediation: "Güçlü binding (SID) zorunlu; zayıf eşleme registry ayarlarını düzeltin."
  references:
    - "https://github.com/ly4k/Certipy/wiki"

adcs-esc11:
  title: "ADCS ESC11 (ICPR'a NTLM relay)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, relay]
  summary: "RPC enrollment'ta şifreleme zorunlu değil → NTLM relay."
  description: >
    CA'da IF_ENFORCEENCRYPTICERTREQUEST ayarlı değilse, RPC (ICPR) enrollment'a
    coercion ile yakalanan NTLM relay edilerek sertifika alınabilir.
  exploitation: "MANUEL (yarı) — coercion + ntlmrelayx ICPR; relay zinciri operatör kontrolünde."
  remediation: "RPC enrollment'ta şifrelemeyi zorunlu kılın; EPA; gereksiz enrollment kapat."
  references:
    - "https://github.com/ly4k/Certipy/wiki"

adcs-esc12:
  title: "ADCS ESC12 (CA anahtarı YubiHSM / shell erişimi)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs]
  summary: "CA özel anahtarına shell/HSM erişimi → sertifika üretimi."
  description: >
    CA sunucusuna shell erişimi ve YubiHSM üzerindeki anahtarın kullanılabilmesi,
    saldırganın keyfi sertifika (hatta Golden Certificate) üretmesine yol açar.
  exploitation: "MANUEL — CA host erişimi + anahtar kullanımı; yüksek etki."
  remediation: "CA host erişimini Tier-0 ile sınırlayın; HSM PIN/erişim kontrolü."
  references:
    - "https://github.com/ly4k/Certipy/wiki"

adcs-esc13:
  title: "ADCS ESC13 (OID grup bağlı issuance policy)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "Issuance policy bir gruba bağlı → sertifika grup üyeliği kazandırır."
  description: >
    Enroll edilebilen bir şablonun issuance policy'si ayrıcalıklı bir gruba (OID
    group link) bağlıysa, alınan sertifika o grubun üyeliğini sağlar.
  exploitation: "MANUEL — certipy ile şablonu enroll et, sertifikayla ayrıcalık kazan."
  remediation: "Issuance policy–grup bağlarını denetleyin; gereksizleri kaldırın."
  references:
    - "https://posts.specterops.io/adcs-esc13-abuse-technique-fda4272fbd53"

adcs-esc14:
  title: "ADCS ESC14 (zayıf explicit sertifika eşlemesi)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, acl, privesc]
  summary: "altSecurityIdentities üzerinde yazma → hedef hesaba sertifika eşle."
  description: >
    Hedef hesabın altSecurityIdentities özelliğine yazabilen principal, kendi
    sertifikasını o hesaba eşleyerek kimliğini taklit eder.
  exploitation: "MANUEL — altSecurityIdentities'e explicit mapping yaz, PKINIT ile taklit."
  remediation: "altSecurityIdentities yazma ACL'lerini kısıtlayın; güçlü eşleme."
  references:
    - "https://github.com/ly4k/Certipy/wiki"

adcs-esc15:
  title: "ADCS ESC15 (EKUwu — Application Policies, CVE-2024-49019)"
  severity: critical
  category: vuln
  cve: [CVE-2024-49019]
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "V1 şablonlarda keyfi application policy enjekte → client auth sertifikası."
  description: >
    Schema V1 şablonlarda 'enrollee supplies subject' ile talepte keyfi application
    policy (ör. Client Authentication) enjekte edilerek kimlik doğrulayan sertifika alınır.
  exploitation: "MANUEL — certipy req ile application policy enjekte ederek sertifika."
  remediation: "KB5049983+ yamalarını uygulayın; V1 şablonları sıkılaştırın/kaldırın."
  references:
    - "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2024-49019"

adcs-esc16:
  title: "ADCS ESC16 (CA genelinde güvenlik uzantısı kapalı)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "CA tüm sertifikalarda SID security extension'ı atlar → ESC9 benzeri."
  description: >
    CA, szOID_NTDS_CA_SECURITY_EXT'i devre dışı listesine aldığından tüm
    sertifikalarda SID bağlama yok; zayıf eşlemeyle domain genelinde taklit mümkün.
  exploitation: "MANUEL — UPN manipülasyonu + zayıf eşleme ile hedef kullanıcı."
  remediation: "CA'da security extension devre dışı bırakmayı kaldırın; güçlü binding."
  references:
    - "https://github.com/ly4k/Certipy/wiki"

adcs-esc17:
  title: "ADCS ESC17 (Server Auth + SAN → iç hostname TLS sertifikası)"
  severity: high
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, relay, mitm]
  summary: "Server Authentication EKU + enrollee-supplied SAN → herhangi bir iç hostname için geçerli TLS sertifikası."
  description: >
    Server Authentication EKU'lu ve SAN'ı kullanıcının belirleyebildiği bir şablon,
    düşük yetkili bir kullanıcının WSUS/iç sunucu gibi herhangi bir hostname için
    geçerli TLS sertifikası almasına izin verir; bu sertifikayla HTTPS koruması
    aşılıp MITM (ör. WSUS üzerinden kod dağıtımı) yapılabilir. (Digitrace: A. Neff & P. Knüfer)
  exploitation: >
    MANUEL — certipy req ile hedef hostname (SAN) için sertifika alınır; HTTPS/WSUS
    MITM operatör kararı ve koordinasyonuyla.
  remediation: >
    Server Auth şablonlarında 'enrollee supplies subject'i kapatın; SAN'ı kısıtlayın;
    manager approval ekleyin; WSUS'u HTTPS + imza doğrulamayla sıkılaştırın.
  references:
    - "https://mustafanafizdurukan.github.io/posts/esc17-wsus-dns-abuse"
    - "https://github.com/ly4k/Certipy/wiki"

attack-path:
  title: "Saldırı yolu (düşük yetkiden yüksek-değere)"
  severity: critical
  category: config
  phase: bloodhound
  manual_only: true
  tags: [bloodhound, privesc, path]
  summary: "Sahip olunan/düşük yetkili principal'den Domain Admins / DC / domain ele geçirmeye giden çok-adımlı yol."
  description: >
    BloodHound grafiğinde, elimizdeki (ya da Domain Users gibi geniş) bir
    principal'den yüksek-değer hedefe (Domain Admins, Enterprise Admins,
    Administrators, DC, domain) ulaşan kenar zinciri bulundu. Her kenar
    suistimal edilebilir bir hak (GenericAll, MemberOf, DCSync, WriteDacl,
    ForceChangePassword vb.). Zincirin tamamlanması domain ele geçirmedir.
  exploitation: >
    MANUEL — yolun her adımı sırayla suistimal edilir (ör. GenericAll →
    hedef parolasını sıfırla / Shadow Cred ekle; DCSync → secretsdump → krbtgt
    → golden ticket). Adım seçimi, gürültü ve zamanlama operatör kararı.
    BloodHound arayüzünde yol görselleştirilip doğrulanmalı.
  remediation: >
    Zincirdeki en zayıf kenarı kır: aşırı ACL'leri kaldır, DCSync/replikasyon
    haklarını yalnız DC'lere bırak, ayrıcalıklı grup üyeliklerini azalt,
    Tier-0 ayrımı uygula.
  references:
    - "https://bloodhound.specterops.io/"
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology"

local-admin:
  title: "Kimlik bilgisi birden çok makinede yerel admin"
  severity: high
  category: cred
  phase: postcred
  manual_only: true
  tags: [lateral, postcred]
  summary: "Elde edilen kimlik bir veya daha çok hostta yerel yönetici → yatay hareket."
  description: >
    Spray/roast/relay/paylaşımdan elde edilen (veya verilen) kimlik bilgisi,
    birden çok makinede yerel admin yetkisine sahip. Bu yatay hareket ve
    kimlik bilgisi/secret toplama (LSASS/SAM) imkânı demektir.
  exploitation: >
    MANUEL — nxc ile Pwn3d! işaretli hostlarda komut yürütme (wmiexec/psexec),
    secretsdump (LSASS/SAM) yalnız kapsam izin veriyorsa ve opt-in.
  remediation: >
    Yerel admin paylaşımını azaltın (LAPS), ayrıcalıklı kimlikleri Tier bazında
    ayırın, yeniden-kullanılan parolaları engelleyin.
  references:
    - "https://book.hacktricks.xyz/windows-hardening/ntlm"

password-spray:
  title: "Password spray yüzeyi (lockout-aware)"
  severity: medium
  category: config
  phase: kerberos
  manual_only: true
  tags: [spray, kerberos]
  summary: "Numaralandırılan kullanıcılar + lockout politikası → kontrollü spray yüzeyi."
  description: >
    Domain kullanıcıları numaralandırıldı ve parola politikası okundu. Spray
    için güvenli deneme bütçesi hesaplanabilir; ama parola/kural seçimi ve
    zamanlama yargı gerektirir.
  exploitation: >
    KESİNLİKLE MANUEL ve lockout-aware — eşik okunmadan asla denenmez. Operatör
    tek parola/pencere ile sınırlı dener (nxc --continue-on-success YOK, throttle).
  remediation: "Güçlü parola politikası, makul lockout, sık parolaları yasakla, MFA."
  references:
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/password-spraying"
