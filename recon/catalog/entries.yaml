adcs-esc3:
  title: "ADCS ESC3 (Enrollment Agent şablonu)"
  severity: critical
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "Certificate Request Agent EKU → başkası adına sertifika talebi."
  description: >
    Enrollment Agent (Certificate Request Agent EKU) şablonuna erişim, saldırganın
    başka kullanıcılar adına (ör. Domain Admin) sertifika talep etmesine izin verir.
  exploitation: "MANUEL — certipy req -on-behalf-of ile hedef kullanıcı sertifikası."
  remediation: "Enrollment Agent şablonlarını ve enroll haklarını kısıtlayın; manager approval."
  references:
