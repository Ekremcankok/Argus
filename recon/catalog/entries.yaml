adcs-esc2:
  title: "ADCS ESC2 (Any Purpose / EKU yok şablon)"
  severity: critical
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "Any Purpose EKU veya EKU'suz şablon → her amaçla kullanılabilir sertifika."
  description: >
    Şablonun EKU'su 'Any Purpose' veya hiç EKU yok; düşük yetkili enroll hakkıyla
