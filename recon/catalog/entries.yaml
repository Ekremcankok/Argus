machineaccountquota:
  title: "MachineAccountQuota > 0"
  severity: medium
  category: config
  phase: ad
  manual_only: false
  tags: [ad, rbcd]
  summary: "Standart kullanıcı makine hesabı oluşturabilir — noPac/RBCD yüzeyi."
  description: >
    Varsayılan MAQ=10; herhangi bir kullanıcı bilgisayar hesabı ekleyebilir.
    noPac ve RBCD saldırı zincirlerinin ön koşulu.
  remediation: "ms-DS-MachineAccountQuota=0; makine ekleme yetkisini delege edin."
  references:
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology"

unconstrained-delegation:
  title: "Unconstrained delegation"
  severity: high
  category: config
  mitre: [T1558]
  phase: ad
  manual_only: false
  tags: [ad, delegation]
  summary: "Bilet hırsızlığı — coercion ile DC TGT yakalama."
  description: >
    Unconstrained delegation ayarlı host, kendisine kimlik doğrulayan her
    principal'in TGT'sini belleğinde tutar. DC'yi coerce edip TGT yakalamak
    domain ele geçirmeye götürür.
  exploitation: >
    YARI MANUEL — host ele geçirildiyse Rubeus monitor + printerbug ile DC
    TGT yakalama; ticket kullanımı sonraki faz.
  remediation: >
    Unconstrained delegation'ı kaldırın; constrained/RBCD'ye geçin; hassas
    hesapları 'Account is sensitive, cannot be delegated' yapın.
  references:
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/unconstrained-delegation"

constrained-delegation:
  title: "Constrained delegation / yazılabilir RBCD"
  severity: high
  category: config
  phase: ad
  manual_only: false
  tags: [ad, delegation]
  summary: "S4U/protokol geçişi veya yazılabilir msDS-AllowedToActOnBehalfOf → yetki yükseltme."
  description: >
    Constrained delegation (özellikle protokol geçişi) veya bir bilgisayar
    nesnesinde yazılabilir RBCD özelliği, hedef servise rastgele kullanıcı
    taklidiyle erişim sağlar.
  exploitation: >
    YARI MANUEL — S4U (Rubeus/getST.py) ile hedef CIFS/HOST bileti üretme;
    ticket kullanımı sonraki faz.
  remediation: "Delegasyonu en aza indirin; RBCD yazma ACL'lerini denetleyin."
  references:
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/constrained-delegation"

dcsync-rights:
  title: "DCSync hakkı (DS-Replication-Get-Changes)"
  severity: critical
  category: config
  mitre: [T1003.006]
  phase: ad
  manual_only: true
  tags: [ad, acl, dcsync]
  summary: "Replikasyon hakkı olan principal tüm hash'leri çekebilir."
  description: >
    DS-Replication-Get-Changes(-All) hakkına sahip ayrıcalıksız bir hesap,
    DC gibi davranıp krbtgt dahil tüm parola hash'lerini çekebilir.
  exploitation: >
    MANUEL (dump) — secretsdump.py -just-dc / nxc --ntds. Yüksek etki;
    yalnızca kapsam açıkça izin veriyorsa ve opt-in bayrağıyla.
  remediation: >
    Replikasyon haklarını yalnızca DC'lere/gerekli hesaplara bırakın; ACL
    anomalilerini düzeltin.
  references:
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/dcsync"

acl-abuse:
  title: "Tehlikeli ACL/ACE (GenericAll/WriteDACL vb.)"
  severity: high
  category: config
  mitre: [T1222]
  phase: ad
  manual_only: false
  tags: [ad, acl, bloodhound]
  summary: "Nesne üzerinde aşırı hak → parola sıfırlama/yetki ele geçirme."
  description: >
    GenericAll/GenericWrite/WriteDACL/WriteOwner/ForceChangePassword/AddMember
    gibi haklar; kullanıcı/grup/bilgisayar/GPO/OU üzerinde yanlış atanmışsa
    yetki yükseltme yolu açar (ör. hedef kullanıcının parolasını sıfırlama).
  exploitation: >
    YARI MANUEL — BloodHound yol analizi; GenericAll ile net rpc password /
    targetedKerberoast; yürütme kararı operatöre ait.
  remediation: "Aşırı ACE'leri kaldırın; en az yetki; Tier-0 nesnelerini koruyun."
  references:
    - "https://book.hacktricks.xyz/windows-hardening/active-directory-methodology/acl-persistence-abuse"

shadow-credentials:
  title: "Shadow Credentials (msDS-KeyCredentialLink yazılabilir)"
  severity: high
  category: config
  phase: ad
  manual_only: false
  tags: [ad, adcs, pkinit]
  summary: "Yazılabilir KeyCredentialLink → PKINIT ile kimlik ele geçirme."
  description: >
    Hedef nesnenin msDS-KeyCredentialLink özelliğine yazabilen principal,
    kendi anahtarını ekleyip PKINIT ile o nesne olarak kimlik doğrular.
  exploitation: >
    YARI MANUEL — certipy shadow auto / Whisker; anahtar ekleme ve TGT alma
    operatör kararı.
  remediation: "KeyCredentialLink yazma ACL'lerini denetleyin; Key Trust'ı koruyun."
  references:
    - "https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ab"

adcs-esc1:
  title: "ADCS ESC1 (enrollee-supplies-subject)"
  severity: critical
  category: vuln
  mitre: [T1649]
  phase: ad
  manual_only: true
  tags: [adcs, privesc]
  summary: "Şablon SAN'a izin veriyor → herhangi bir kullanıcı olarak sertifika."
  description: >
    Client Authentication + enrollee supplies subject + Domain Users enroll
    hakkı olan şablonda, düşük yetkili kullanıcı SAN'a Domain Admin yazıp o
    kullanıcı olarak kimlik doğrulayan sertifika alır.
  exploitation: >
    MANUEL — certipy req ... -upn administrator; alınan pfx ile PKINIT/TGT.
    Şablon seçimi ve talep zinciri operatör kararı (yanlış şablon iz bırakır).
  remediation: >
    Şablonda 'enrollee supplies subject'i kaldırın; enroll yetkisini daraltın;
    manager approval ekleyin.
  references:
    - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

adcs-esc8:
  title: "ADCS ESC8 (web enrollment NTLM relay)"
  severity: critical
  category: vuln
  phase: ad
  manual_only: true
  tags: [adcs, relay]
  summary: "HTTP enrollment + NTLM → coercion ile DC sertifikası/relay."
  description: >
    CA web enrollment (certsrv) HTTP üzerinde NTLM kabul ediyor. Coercion ile
    DC auth'u certsrv'e relay edilip DC için sertifika alınır → domain ele geçirme.
  exploitation: >
    MANUEL (yarı) — araç ESC8 yüzeyini + coercion hedefini hazırlar; PetitPotam
    + ntlmrelayx --target http://CA/certsrv zinciri operatör kontrolünde.
  remediation: >
    Web enrollment'ta NTLM'i kapatın/EPA zorunlu; HTTPS + kanal bağlama;
    gereksizse certsrv'i kaldırın.
  references:
    - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

